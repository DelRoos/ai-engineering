<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
<title id="t">Le parcours de la formation AI Engineer</title>
<desc id="d">Sept étapes en escalier, du débutant à l'expert : 0 Fondations (20 semaines), 1 Données et ML (10), 2 Deep learning (6), 3 LLM, RAG et agents (12), 4 Production (9), 5 Sécurité et éthique (3), 6 Capstone et carrière (10). Chaque étape se termine par un projet. Avec 2 semaines de consolidation, 72 semaines au total.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1410"/><stop offset="1" stop-color="#0d0c0b"/></linearGradient>
<radialGradient id="glow" cx="0.85" cy="0.1" r="0.6"><stop offset="0" stop-color="#f59e42" stop-opacity="0.16"/><stop offset="1" stop-color="#f59e42" stop-opacity="0"/></radialGradient>
<linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fcd38b"/><stop offset="1" stop-color="#e8794a"/></linearGradient>
</defs>
<rect width="1200" height="640" rx="24" fill="url(#bg)"/>
<rect width="1200" height="640" rx="24" fill="url(#glow)"/>
<rect x="0.5" y="0.5" width="1199" height="639" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
<g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<text x="44" y="68" font-size="30" font-weight="700" fill="#f3ede4" letter-spacing="-0.5">Un seul parcours, <tspan fill="#f5a35a">du premier code au métier</tspan></text>
<text x="44" y="100" font-size="17" fill="#a89f94">7 étapes, 72 semaines. Chaque étape se termine par un projet public, vérifié par des tests.</text>
<rect x="44" y="356" width="152" height="200" rx="14" fill="#f59e42" fill-opacity="0.070" stroke="#f59e42" stroke-opacity="0.18"/>
<rect x="58" y="356" width="124" height="3" rx="1.5" fill="url(#amber)" fill-opacity="0.35"/>
<text x="60" y="402" font-size="38" font-weight="800" fill="url(#amber)">0</text>
<text x="60" y="430" font-size="14.5" font-weight="700" fill="#f3ede4">Fondations</text>
<text x="60" y="451" font-size="13" fill="#a89f94">20 semaines</text>
<text x="60" y="488" font-size="11" font-weight="600" fill="#a89f94" letter-spacing="0.6">PROJET 0</text>
<line x1="60" y1="496" x2="180" y2="496" stroke="#ffffff" stroke-opacity="0.08"/>
<text font-size="12.5" fill="#d8cfc4"><tspan x="60" y="518">Analyseur de</tspan><tspan x="60" dy="17">données</tspan></text>
<rect x="204" y="320" width="152" height="236" rx="14" fill="#f59e42" fill-opacity="0.115" stroke="#f59e42" stroke-opacity="0.25"/>
<rect x="218" y="320" width="124" height="3" rx="1.5" fill="url(#amber)" fill-opacity="0.45"/>
<text x="220" y="366" font-size="38" font-weight="800" fill="url(#amber)">1</text>
<text x="220" y="394" font-size="14.5" font-weight="700" fill="#f3ede4">Données et ML</text>
<text x="220" y="415" font-size="13" fill="#a89f94">10 semaines</text>
<text x="220" y="488" font-size="11" font-weight="600" fill="#a89f94" letter-spacing="0.6">PROJET 1</text>
<line x1="220" y1="496" x2="340" y2="496" stroke="#ffffff" stroke-opacity="0.08"/>
<text font-size="12.5" fill="#d8cfc4"><tspan x="220" y="518">Modèle de</tspan><tspan x="220" dy="17">prédiction</tspan></text>
<rect x="364" y="284" width="152" height="272" rx="14" fill="#f59e42" fill-opacity="0.160" stroke="#f59e42" stroke-opacity="0.32"/>
<rect x="378" y="284" width="124" height="3" rx="1.5" fill="url(#amber)" fill-opacity="0.55"/>
<text x="380" y="330" font-size="38" font-weight="800" fill="url(#amber)">2</text>
<text x="380" y="358" font-size="14.5" font-weight="700" fill="#f3ede4">Deep learning</text>
<text x="380" y="379" font-size="13" fill="#a89f94">6 semaines</text>
<text x="380" y="488" font-size="11" font-weight="600" fill="#a89f94" letter-spacing="0.6">PROJET 2</text>
<line x1="380" y1="496" x2="500" y2="496" stroke="#ffffff" stroke-opacity="0.08"/>
<text font-size="12.5" fill="#d8cfc4"><tspan x="380" y="518">Classifieur de</tspan><tspan x="380" dy="17">plantes</tspan></text>
<rect x="524" y="248" width="152" height="308" rx="14" fill="#f59e42" fill-opacity="0.205" stroke="#f59e42" stroke-opacity="0.39"/>
<rect x="538" y="248" width="124" height="3" rx="1.5" fill="url(#amber)" fill-opacity="0.65"/>
<text x="540" y="294" font-size="38" font-weight="800" fill="url(#amber)">3</text>
<text x="540" y="322" font-size="14.5" font-weight="700" fill="#f3ede4">LLM, RAG, agents</text>
<text x="540" y="343" font-size="13" fill="#a89f94">12 semaines</text>
<text x="540" y="488" font-size="11" font-weight="600" fill="#a89f94" letter-spacing="0.6">PROJET 3</text>
<line x1="540" y1="496" x2="660" y2="496" stroke="#ffffff" stroke-opacity="0.08"/>
<text font-size="12.5" fill="#d8cfc4"><tspan x="540" y="518">Assistant RAG</tspan><tspan x="540" dy="17">hors ligne</tspan></text>
<rect x="684" y="212" width="152" height="344" rx="14" fill="#f59e42" fill-opacity="0.250" stroke="#f59e42" stroke-opacity="0.46"/>
<rect x="698" y="212" width="124" height="3" rx="1.5" fill="url(#amber)" fill-opacity="0.75"/>
<text x="700" y="258" font-size="38" font-weight="800" fill="url(#amber)">4</text>
<text x="700" y="286" font-size="14.5" font-weight="700" fill="#f3ede4">Production</text>
<text x="700" y="307" font-size="13" fill="#a89f94">9 semaines</text>
<text x="700" y="488" font-size="11" font-weight="600" fill="#a89f94" letter-spacing="0.6">PROJET 4</text>
<line x1="700" y1="496" x2="820" y2="496" stroke="#ffffff" stroke-opacity="0.08"/>
<text font-size="12.5" fill="#d8cfc4"><tspan x="700" y="518">Mise en</tspan><tspan x="700" dy="17">production</tspan></text>
<rect x="844" y="176" width="152" height="380" rx="14" fill="#f59e42" fill-opacity="0.295" stroke="#f59e42" stroke-opacity="0.53"/>
<rect x="858" y="176" width="124" height="3" rx="1.5" fill="url(#amber)" fill-opacity="0.85"/>
<text x="860" y="222" font-size="38" font-weight="800" fill="url(#amber)">5</text>
<text x="860" y="250" font-size="14.5" font-weight="700" fill="#f3ede4">Sécurité, éthique</text>
<text x="860" y="271" font-size="13" fill="#a89f94">3 semaines</text>
<text x="860" y="488" font-size="11" font-weight="600" fill="#a89f94" letter-spacing="0.6">PROJET 5</text>
<line x1="860" y1="496" x2="980" y2="496" stroke="#ffffff" stroke-opacity="0.08"/>
<text font-size="12.5" fill="#d8cfc4"><tspan x="860" y="518">Audit de</tspan><tspan x="860" dy="17">sécurité et biais</tspan></text>
<rect x="1004" y="140" width="152" height="416" rx="14" fill="#f59e42" fill-opacity="0.340" stroke="#f59e42" stroke-opacity="0.60"/>
<rect x="1018" y="140" width="124" height="3" rx="1.5" fill="url(#amber)" fill-opacity="0.95"/>
<text x="1020" y="186" font-size="38" font-weight="800" fill="url(#amber)">6</text>
<text x="1020" y="214" font-size="14.5" font-weight="700" fill="#f3ede4">Capstone, carrière</text>
<text x="1020" y="235" font-size="13" fill="#a89f94">10 semaines</text>
<text x="1020" y="488" font-size="11" font-weight="600" fill="#a89f94" letter-spacing="0.6">PROJET 6</text>
<line x1="1020" y1="496" x2="1140" y2="496" stroke="#ffffff" stroke-opacity="0.08"/>
<text font-size="12.5" fill="#d8cfc4"><tspan x="1020" y="518">Solution complète,</tspan><tspan x="1020" dy="17">pitch en anglais</tspan></text>
<line x1="44" y1="578" x2="1156" y2="578" stroke="#ffffff" stroke-opacity="0.1"/>
<text x="44" y="610" font-size="14" fill="#a89f94">Débutant&#160;: aucune expérience demandée</text>
<text x="1156" y="610" font-size="14" fill="#a89f94" text-anchor="end">+ 2 semaines de consolidation. Expert&#160;: prêt pour le métier</text>
</g></svg>
